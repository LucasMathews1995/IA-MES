quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5444/rag_db
quarkus.datasource.devservices.enabled=false

# Configurações Ollama / LangChain4j
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=llama3.2
quarkus.langchain4j.ollama.timeout=60s
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text
quarkus.langchain4j.pgvector.dimension=768
quarkus.langchain4j.ollama.chat-model.temperature=0.0

# Configurações OIDC / Keycloak
quarkus.oidc.auth-server-url=http://192.168.15.11:8180/realms/mes-realm
quarkus.oidc.client-id=mes-app
quarkus.oidc.application-type=service
quarkus.keycloak.devservices.enabled=false
quarkus.test.continuous-testing=disabled
quarkus.oidc.token.issuer=any
# Aceita o token mesmo que a audiência seja 'account'
quarkus.oidc.token.audience=any
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

quarkus.datasource.active=true
quarkus.datasource.jdbc.pooling-enabled=true


quarkus.hibernate-orm.database.generation=update